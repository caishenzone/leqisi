<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>小白兔回家 · Minecraft 像素动画</title>
<style>
/* ============ 基础 ============ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sky-top:#6ec0f0; --sky-mid:#9fd6f5; --sky-bot:#cfeaf8;
  --night:0;                 /* 0 白天 → 1 夜晚 */
  --ground-h:104px;
  --ui:#e8e6df;
}
html,body{height:100%}
body{
  background:#0d1117; color:var(--ui);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  display:flex; align-items:center; justify-content:center;
  padding:18px; overflow:hidden;
}
.pixel{ image-rendering:pixelated; image-rendering:crisp-edges; }

/* ============ 外框 ============ */
#app{
  width:min(1180px,100%);
  border:4px solid #2f2a24;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.6), inset 0 0 0 3px #6b5f4d;
  background:#1a1712;
}

/* ============ 场景 ============ */
#scene{
  position:relative;
  height:clamp(380px,58vh,520px);
  overflow:hidden;
  cursor:pointer;
  user-select:none;
}
#sky{
  position:absolute; inset:0;
  background:linear-gradient(to bottom,var(--sky-top) 0%,var(--sky-mid) 52%,var(--sky-bot) 100%);
  transition:background .25s linear;
}
/* 太阳 / 月亮：方形像素天体 */
.celestial{position:absolute;width:52px;height:52px;left:0;top:0;will-change:transform}
#sun{background:#ffe98a;box-shadow:0 0 0 4px #ffd54a,0 0 70px 24px rgba(255,214,74,.45)}
#moon{background:#f3f6ff;box-shadow:0 0 0 4px #d5dcf0,0 0 60px 18px rgba(210,225,255,.35)}
#moon::after{content:"";position:absolute;right:8px;top:12px;width:12px;height:12px;background:#dfe5f5;box-shadow:14px 16px 0 -4px #dfe5f5,-4px 22px 0 -3px #dfe5f5}

#stars{position:absolute;inset:0;opacity:0;pointer-events:none}
.star{position:absolute;width:3px;height:3px;background:#fff;animation:tw 3s infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}

/* 云 */
#clouds{position:absolute;inset:0;pointer-events:none}

/* 视差层 */
.layer{position:absolute;left:0;bottom:0;height:100%;width:100%;will-change:transform}
#hills{bottom:var(--ground-h)}
#world{bottom:var(--ground-h)}

/* 地面：草方块 + 泥土 */
#ground{
  position:absolute;left:0;right:0;bottom:0;height:var(--ground-h);
  background:
    /* 方块缝隙 */
    repeating-linear-gradient(90deg, rgba(0,0,0,.14) 0 2px, transparent 2px 32px),
    /* 草边 */
    linear-gradient(to bottom,#6aa832 0 6px,#5d9a2b 6px 14px,#7a5a35 14px 18px,#6f5030 18px 100%),
    /* 泥土颗粒 */
    repeating-linear-gradient(90deg,#6f5030 0 8px,#775636 8px 16px);
  box-shadow:inset 0 4px 0 rgba(255,255,255,.14), inset 0 -12px 24px rgba(0,0,0,.25);
  will-change:background-position;
}
#grassTop{
  position:absolute;left:0;right:0;bottom:var(--ground-h);height:8px;
  background:repeating-linear-gradient(90deg,#7cbb3a 0 6px,#6aa832 6px 12px);
  will-change:background-position;
}

/* 夜幕遮罩 */
#nightVeil{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(8,12,38,.55),rgba(10,16,44,.35));
  opacity:calc(var(--night)*.78);
}

/* 精灵通用 */
.spriteWrap{position:absolute;left:0;bottom:0}
.spriteWrap>i{display:block}

/* 世界物件 */
.obj{position:absolute;bottom:0;will-change:transform}
.tree{animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:skewX(0deg)}50%{transform:skewX(-1.4deg)}}
.carrot{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.carrot.gone{animation:none;opacity:0;transform:translateY(-34px) scale(1.5);transition:.4s ease-out}
.creeper.hiss{animation:hiss .45s ease-out 2}
@keyframes hiss{0%{filter:none;transform:scale(1)}45%{filter:brightness(2.4);transform:scale(1.14)}100%{filter:none;transform:scale(1)}}
.pig{animation:bob2 2.4s ease-in-out infinite}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* 兔子 */
#bunny{position:absolute;bottom:0;will-change:transform;z-index:6;transform-origin:50% 100%}
#bunny.gone{opacity:0;transform:translate(var(--bx),0) scale(.35);transition:.7s ease-in}

/* 房子 */
#house{position:absolute;bottom:0;z-index:4}
#doorWrap{position:absolute;perspective:400px}
#door{transform-origin:left center;transition:transform 1.1s cubic-bezier(.3,.9,.2,1)}
#doorWrap.open #door{transform:rotateY(-78deg)}
#doorHole{position:absolute;inset:0;background:linear-gradient(to bottom,#241a10,#120c07);z-index:-1}
.win-glow{position:absolute;background:radial-gradient(circle,rgba(255,214,120,.95),rgba(255,190,80,.25) 60%,transparent 72%);opacity:0;transition:opacity 1s ease;pointer-events:none}
.win-glow.on{opacity:1}
.torch-glow{position:absolute;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,190,90,.5),transparent 68%);
  opacity:calc(var(--night)*.95);animation:flick 1.4s infinite;pointer-events:none}
@keyframes flick{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* 粒子 */
#fx{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.pt{position:absolute;width:5px;height:5px;will-change:transform,opacity}
.ff{position:absolute;width:4px;height:4px;background:#ffe57a;box-shadow:0 0 8px 3px rgba(255,229,122,.6);opacity:0}

/* ============ HUD ============ */
#hud{
  position:absolute;left:0;right:0;top:0;padding:12px 14px;
  display:flex;align-items:center;gap:14px;
  background:linear-gradient(to bottom,rgba(0,0,0,.42),transparent);
  z-index:10;pointer-events:none;
}
#bar{
  position:relative;flex:1;height:14px;
  background:rgba(0,0,0,.42);border:2px solid rgba(255,255,255,.35);
}
#barFill{position:absolute;inset:2px auto 2px 2px;width:0;background:linear-gradient(90deg,#8be04a,#f7d84a);transition:width .1s linear}
#barIcon{position:absolute;top:-13px;left:0;font-size:18px;transform:translateX(-50%);transition:left .1s linear;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.chip{
  font-size:13px;font-weight:700;letter-spacing:.4px;
  background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.28);
  padding:4px 9px;white-space:nowrap;text-shadow:1px 1px 0 rgba(0,0,0,.6)
}

/* ============ 控制条 ============ */
#bottom{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 14px;background:#232019;border-top:3px solid #4a4136;
}
button{
  font:inherit;font-size:13px;font-weight:700;color:#f0ece2;
  background:linear-gradient(#7c9c53,#5d7a3c);
  border:2px solid #2f3a22;border-bottom-width:4px;
  padding:8px 14px;cursor:pointer;letter-spacing:.5px;
  text-shadow:1px 1px 0 rgba(0,0,0,.45);
}
button:hover{filter:brightness(1.12)}
button:active{border-bottom-width:2px;transform:translateY(2px)}
button.alt{background:linear-gradient(#8b8378,#6a635a)}
button.on{background:linear-gradient(#d5a34a,#b07f2c)}
#bottom .sep{flex:1}
#tip{font-size:12px;opacity:.72;letter-spacing:.3px}

/* ============ 结束卡片 ============ */
#end{
  position:absolute;inset:0;z-index:20;display:none;
  align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 45%,rgba(0,0,0,.25),rgba(0,0,0,.72));
  animation:fade .8s ease;
}
#end.show{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
#card{
  text-align:center;padding:26px 34px;
  background:#2b261e;border:3px solid #6b5f4d;
  box-shadow:0 18px 40px rgba(0,0,0,.6);
}
#card h2{font-size:26px;letter-spacing:2px;margin-bottom:6px}
#card p{font-size:13px;opacity:.8;margin-bottom:16px}
#card .stats{display:flex;gap:18px;justify-content:center;margin-bottom:18px}
#card .stats div{font-size:12px;opacity:.75}
#card .stats b{display:block;font-size:20px;opacity:1;color:#f7d84a}
</style>
</head>
<body>
<div id="app">
  <div id="scene" title="点击或按空格让小白兔跳得更高">
    <div id="sky"></div>
    <div id="stars"></div>
    <div id="sun" class="celestial"></div>
    <div id="moon" class="celestial"></div>
    <div id="clouds"></div>

    <div id="hills" class="layer"></div>
    <div id="grassTop"></div>
    <div id="ground"></div>
    <div id="world" class="layer"></div>

    <div id="nightVeil"></div>
    <div id="fx"></div>

    <div id="hud">
      <span class="chip">🏠 回家进度</span>
      <div id="bar"><div id="barFill"></div><div id="barIcon">🐰</div></div>
      <span class="chip">🥕 <span id="cCarrot">0</span></span>
      <span class="chip">💨 <span id="cJump">0</span> 跳</span>
      <span class="chip" id="cPhase">白天</span>
    </div>

    <div id="end">
      <div id="card">
        <h2>🐰 小白兔到家啦！</h2>
        <p>门关上了，窗里亮起温暖的灯光。</p>
        <div class="stats">
          <div><b id="sCarrot">0</b>胡萝卜</div>
          <div><b id="sJump">0</b>次跳跃</div>
          <div><b id="sTime">0s</b>回家用时</div>
        </div>
        <button id="again">再看一次</button>
      </div>
    </div>
  </div>

  <div id="bottom">
    <button id="btnPlay">⏸ 暂停</button>
    <button id="btnReset" class="alt">↺ 重新开始</button>
    <button id="btnSpeed" class="alt">速度 1×</button>
    <button id="btnSky" class="alt">天色 自动</button>
    <button id="btnSound" class="alt">🔇 音效关</button>
    <span class="sep"></span>
    <span id="tip">空格 / 点击画面 = 大跳　·　纯 HTML + CSS + JavaScript，无任何框架</span>
  </div>
</div>

<script>
"use strict";
/* =======================================================================
   小白兔回家 · Minecraft 像素动画
   全部精灵由 JS 生成 box-shadow 点阵，无图片资源
   ======================================================================= */

/* ---------- 1. 像素精灵工具 ---------- */
function makeSprite(map, palette, px, cls){
  const h = map.length, w = Math.max(...map.map(r => r.length));
  const sh = [];
  for(let y=0;y<h;y++){
    const row = map[y];
    for(let x=0;x<row.length;x++){
      const c = row[x];
      if(c === '.' || c === ' ') continue;
      const col = palette[c];
      if(!col) continue;
      sh.push(`${x*px}px ${y*px}px 0 0 ${col}`);
    }
  }
  const wrap = document.createElement('div');
  wrap.className = 'spriteWrap' + (cls ? ' ' + cls : '');
  wrap.style.width  = (w*px) + 'px';
  wrap.style.height = (h*px) + 'px';
  const inner = document.createElement('i');
  inner.style.cssText = `width:${px}px;height:${px}px;box-shadow:${sh.join(',')}`;
  wrap.appendChild(inner);
  wrap._w = w*px; wrap._h = h*px;
  return wrap;
}

/* ---------- 2. 调色板 ---------- */
const PAL = {
  // 兔子
  W:'#f8f7f3', S:'#dcdad2', R:'#c4463c', P:'#f2a9b4',
  // 苦力怕
  G:'#4b8f3c', g:'#3f7a33', h:'#5aa347', K:'#191c17',
  // 猪
  p:'#e8a0a8', q:'#cf8b93', n:'#c97b86', k:'#2b2b2b',
  // 树 / 植被
  l:'#6b4f2a', L:'#4f8a2c', M:'#3f7223', f:'#e0574f', F:'#f2d24b',
  // 建筑
  o:'#c19a62', O:'#a8834f', r:'#8c3f2c', R2:'#6f3122', d:'#7c5a34',
  s:'#9a9a9a', S2:'#7d7d7d', G2:'#a8dcea', t:'#5a4227', T:'#ff9d3a',
  c:'#3c3c3c', w:'#ffffff', y:'#ffe57a', e:'#3a2f22'
};

/* ---------- 3. 精灵点阵 ---------- */
// 兔子：16 x 12，朝右。A = 脚落地，B = 腾空收腿
const BUNNY_A = [
  '..........W..W..',
  '..........W..W..',
  '..........WW.WW.',
  '.........WWWWWW.',
  '........WWWWWWWW',
  '........WWWRWWPW',
  '.WWWWWWWWWWWWWWW',
  'SWWWWWWWWWWWWWW.',
  '.WWWWWWWWWWWWW..',
  '.SWWWWWWWWWWS...',
  '..WWW...WWW.....',
  '..SSS...SSS.....'
];
const BUNNY_B = [
  '..........W..W..',
  '..........W..W..',
  '..........WW.WW.',
  '.........WWWWWW.',
  '........WWWWWWWW',
  '........WWWRWWPW',
  '.WWWWWWWWWWWWWWW',
  'SWWWWWWWWWWWWWW.',
  '.WWWWWWWWWWWWWW.',
  '.SWWWWWWWWWWWS..',
  '.WWW......WWW...',
  'SSS........SS...'
];

// 苦力怕：16 x 16
const CREEPER = [
  'GhGgGGhGgGhGGgGh',
  'gGhGGgGhGgGGhGgG',
  'GhGgGGhGgGhGGgGh',
  'gGhGGgGhGgGGhGgG',
  'GhGKKKhGgKKKGgGh',
  'gGhKKKGhGKKKGgGh',
  'GhGKKKhGgKKKGGgG',
  'GhGgGgKKKKGgGhGg',
  'gGhGGgKKKKGhGgGG',
  'GhGgGGKKKKGgGhGg',
  'GgGhGKKGGKKGgGhG',
  'gGhGgKKGGKKhGgGh',
  'GhGgGGhGgGhGGgGh',
  'gGhGGgGhGgGGhGgG',
  'GhGgGGhGgGhGGgGh',
  'GG.GGgGhGgGG.GGg'
];

// 猪：14 x 8
const PIG = [
  '....pppppppp..',
  '...pppppppppp.',
  '..pppppppkppp.',
  '..ppppppppppnn',
  '..ppppppppppnn',
  '..pppppppppp..',
  '..pp..pp..pp..',
  '..qq..qq..qq..'
];

// 橡树（方块级地图，一格 = 一个方块）
const TREE = [
  '..LLLLL..',
  '.LLLLLLL.',
  'LLLLLLLLL',
  'LLLLMLLLL',
  '.LLLlLLL.',
  '..MLlLM..',
  '....l....',
  '....l....',
  '....l....'
];
const BUSH = [
  '.MLLM.',
  'MLLLLM',
  '.MLLM.'
];
const FLOWER_R = ['.f.','fFf','.f.','.l.','.l.'];
const FLOWER_Y = ['.F.','FfF','.F.','.l.','.l.'];
const CARROT = [
  '.M.M.',
  'MMTMM',
  '.TTT.',
  '.TTT.',
  '..T..'
];
// 远山（方块级）
const HILL = [
  '....MMMMM....',
  '..MMMLLLMMM..',
  '.MMLLLLLLLMM.',
  'MMLLLLLLLLLMM'
];

// 小木屋（方块级地图，一格 = 一个方块）
const HOUSE = [
  '....rrr....',
  '...rrrrr...',
  '..rrrrrrr..',
  '.rrrrrrrrr.',
  'rrrrrrrrrrr',
  '.looooooool',
  '.lGGoooGGol',
  '.lGGoooGGol',
  '.looodooool',
  '.looodooool',
  'sssssssssss'
];

/* ---------- 4. 场景配置 ---------- */
const CFG = {
  BPX: 5,            // 生物像素大小
  WPX: 7,            // 方块级像素大小（树 / 房子）
  DOOR_X: 4180,      // 门的世界坐标
  SPEED: 152,        // 基础速度 px/s
  HOP_T: 0.52,       // 一次跳跃周期（秒）
  HOP_H: 34,         // 常规跳跃高度
  BIG_H: 78          // 大跳高度
};

const $ = s => document.querySelector(s);
const scene=$('#scene'), sky=$('#sky'), world=$('#world'), hills=$('#hills'),
      ground=$('#ground'), grassTop=$('#grassTop'), fx=$('#fx'),
      sunEl=$('#sun'), moonEl=$('#moon'), starsEl=$('#stars'), cloudsEl=$('#clouds');

let bunny, bunnyA, bunnyB, houseEl, doorWrap, winGlows=[], carrots=[], creepers=[], fireflies=[];
let SW = 0, SH = 0;                        // 场景尺寸

/* ---------- 5. 建造世界 ---------- */
function place(parent, el, x, y){
  el.style.left = x + 'px';
  el.style.bottom = (y||0) + 'px';
  parent.appendChild(el);
  return el;
}

function buildStatic(){
  // 星星
  starsEl.innerHTML = '';
  for(let i=0;i<90;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = (Math.random()*100) + '%';
    s.style.top  = (Math.random()*62) + '%';
    s.style.animationDelay = (Math.random()*3) + 's';
    if(Math.random() > .8){ s.style.width='4px'; s.style.height='4px'; }
    starsEl.appendChild(s);
  }
  // 云：像素方块云
  cloudsEl.innerHTML = '';
  const CLOUD = ['.wwww..','wwwwwww','.wwwww.'];
  for(let i=0;i<7;i++){
    const c = makeSprite(CLOUD, PAL, 9 + Math.round(Math.random()*7));
    c.style.left = (i*17 + Math.random()*8) + '%';
    c.style.bottom = 'auto';
    c.style.top = (8 + Math.random()*30) + '%';
    c.style.opacity = .78;
    c.dataset.sp = (0.15 + Math.random()*0.35).toFixed(3);
    c.dataset.x = 0;
    cloudsEl.appendChild(c);
  }
  // 远山
  hills.innerHTML = '';
  for(let x=-200; x<CFG.DOOR_X+1400; x+= 300 + Math.random()*180){
    const hh = makeSprite(HILL, {L:'#3d6b26', M:'#325a1f'}, 10 + Math.round(Math.random()*8));
    place(hills, hh, x, -6);
    hh.style.opacity = .85;
  }
}

function buildWorld(){
  world.innerHTML = '';
  carrots = []; creepers = []; fireflies = [];

  // 树、灌木、花
  for(let x = 160; x < CFG.DOOR_X - 260; x += 190 + Math.random()*170){
    if(Math.random() < .62){
      const t = makeSprite(TREE, PAL, CFG.WPX + Math.round(Math.random()*2), 'tree');
      t.style.animationDelay = (Math.random()*5) + 's';
      place(world, t, x, 0);
    }else{
      place(world, makeSprite(BUSH, PAL, CFG.WPX), x, 0);
    }
    if(Math.random() < .7){
      const fl = Math.random() < .5 ? FLOWER_R : FLOWER_Y;
      place(world, makeSprite(fl, PAL, 4), x + 60 + Math.random()*70, 0);
    }
  }

  // 胡萝卜
  for(let x = 320; x < CFG.DOOR_X - 200; x += 250 + Math.random()*160){
    const c = makeSprite(CARROT, PAL, 6, 'carrot');
    c.style.animationDelay = (Math.random()*1.6) + 's';
    place(world, c, x, 14);
    carrots.push({ x, el:c, got:false });
  }

  // 苦力怕
  [760, 1520, 2260, 3020, 3620].forEach(x => {
    const c = makeSprite(CREEPER, PAL, 5, 'creeper');
    place(world, c, x, 0);
    creepers.push({ x, el:c, done:false });
  });

  // 小猪（背景）
  [980, 2020, 3320].forEach(x => {
    place(world, makeSprite(PIG, PAL, 5, 'pig'), x, 0);
  });

  // 萤火虫（夜晚出现）
  for(let i=0;i<26;i++){
    const f = document.createElement('div');
    f.className = 'ff';
    f.style.left = (Math.random()*100) + '%';
    f.style.top  = (40 + Math.random()*46) + '%';
    f._p = Math.random()*Math.PI*2;
    f._r = 12 + Math.random()*26;
    f._s = .4 + Math.random()*.9;
    fx.appendChild(f);
    fireflies.push(f);
  }

  buildHouse();
  buildBunny();
}

function buildHouse(){
  const px = 9;
  // 房子独立调色板：G 在通用板里是苦力怕绿，这里必须是玻璃蓝
  const HPAL = {
    r:'#8c3f2c', o:'#c19a62', l:'#7c5a34', G:'#a8dcea', d:'#7c5a34', s:'#9a9a9a'
  };
  houseEl = makeSprite(HOUSE, HPAL, px);
  houseEl.id = 'house';
  houseEl.style.left = (CFG.DOOR_X - 5*px) + 'px';
  houseEl.style.bottom = '0';
  world.appendChild(houseEl);

  // 门（可开合）：房子地图里 d 的位置 = 第 8~9 行、第 5 列
  doorWrap = document.createElement('div');
  doorWrap.id = 'doorWrap';
  doorWrap.style.cssText =
    `left:${5*px}px;bottom:${px}px;width:${px}px;height:${px*2}px;`;
  const doorSprite = makeSprite(['d','d'], HPAL, px);
  doorSprite.id = 'door';
  doorSprite.style.position = 'relative';
  const hole = document.createElement('div');
  hole.id = 'doorHole';
  doorWrap.appendChild(hole);
  doorWrap.appendChild(doorSprite);
  houseEl.appendChild(doorWrap);

  // 窗户灯光（房子地图第 6~7 行，第 2~3 与 7~8 列）
  winGlows = [];
  [2, 7].forEach(col => {
    const gl = document.createElement('div');
    gl.className = 'win-glow';
    gl.style.cssText =
      `left:${(col-1.2)*px}px;bottom:${(11-8-1.2)*px}px;width:${px*4.4}px;height:${px*4.4}px;`;
    houseEl.appendChild(gl);
    winGlows.push(gl);
  });

  // 门口火把 + 光圈
  const torch = makeSprite(['T','T','t','t','t'], PAL, 5);
  torch.style.cssText += `left:${6.6*px}px;bottom:${2*px}px;`;
  houseEl.appendChild(torch);
  const tg = document.createElement('div');
  tg.className = 'torch-glow';
  tg.style.cssText += `left:${6.6*px-58}px;bottom:${2*px-46}px;`;
  houseEl.appendChild(tg);

  // 屋后一棵大树
  place(world, makeSprite(TREE, PAL, 11, 'tree'), CFG.DOOR_X + 190, 0);
  // 门前小路
  for(let i=0;i<7;i++){
    place(world, makeSprite(['sS','Ss'], {s:'#a9a49a',S:'#8d887e'}, 8),
      CFG.DOOR_X - 130 + i*30, -2);
  }
}

function buildBunny(){
  bunny = document.createElement('div');
  bunny.id = 'bunny';
  bunnyA = makeSprite(BUNNY_A, PAL, CFG.BPX);
  bunnyB = makeSprite(BUNNY_B, PAL, CFG.BPX);
  bunnyA.style.position = 'absolute'; bunnyA.style.left = 0; bunnyA.style.bottom = 0;
  bunnyB.style.position = 'absolute'; bunnyB.style.left = 0; bunnyB.style.bottom = 0;
  bunnyB.style.opacity = 0;
  bunny.style.width  = bunnyA._w + 'px';
  bunny.style.height = bunnyA._h + 'px';
  bunny.appendChild(bunnyA);
  bunny.appendChild(bunnyB);
  scene.appendChild(bunny);
}

/* ---------- 6. 粒子 ---------- */
const parts = [];
function spawn(x, y, color, n, opt = {}){
  for(let i=0;i<n;i++){
    const el = document.createElement('div');
    el.className = 'pt';
    const sz = opt.size || (3 + Math.random()*4);
    el.style.width = el.style.height = sz + 'px';
    el.style.background = Array.isArray(color) ? color[i % color.length] : color;
    if(opt.text){ el.style.background='none'; el.style.width='auto'; el.style.height='auto';
      el.style.fontSize=(opt.fs||16)+'px'; el.textContent = opt.text; }
    fx.appendChild(el);
    parts.push({
      el, x, y,
      vx:(Math.random()-.5)*(opt.vx||90) + (opt.dx||0),
      vy:(opt.vy||100) + Math.random()*90,
      g: opt.g === undefined ? 260 : opt.g,
      life: 0, max: opt.life || .75
    });
  }
}
function stepParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.life += dt;
    if(p.life > p.max){ p.el.remove(); parts.splice(i,1); continue; }
    p.vy -= p.g * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.el.style.transform = `translate(${p.x}px,${-p.y}px)`;
    p.el.style.opacity = 1 - p.life / p.max;
  }
}

/* ---------- 7. 音效（WebAudio，默认关闭）---------- */
let actx = null, soundOn = false;
function beep(freq, dur, type='square', vol=.05){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}

/* ---------- 8. 天色 ---------- */
const SKY_KEYS = [
  { t:0.00, a:'#6ec0f0', b:'#9fd6f5', c:'#cfeaf8', n:0.00, name:'清晨' },
  { t:0.35, a:'#5aa9e6', b:'#9ed2f0', c:'#e2f0f7', n:0.00, name:'白天' },
  { t:0.60, a:'#4a86c8', b:'#f0a45c', c:'#ffd9a0', n:0.14, name:'黄昏' },
  { t:0.78, a:'#2b3d70', b:'#e2683f', c:'#f7a86b', n:0.42, name:'日落' },
  { t:0.92, a:'#132048', b:'#2c3a68', c:'#5b5478', n:0.80, name:'夜幕' },
  { t:1.00, a:'#0a1030', b:'#151f45', c:'#243158', n:1.00, name:'夜晚' }
];
const hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const mix = (h1,h2,k) => {
  const A = hex2rgb(h1), B = hex2rgb(h2);
  return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')})`;
};
function applySky(t){
  let i = 0;
  while(i < SKY_KEYS.length - 2 && t > SKY_KEYS[i+1].t) i++;
  const A = SKY_KEYS[i], B = SKY_KEYS[i+1];
  const k = Math.min(1, Math.max(0, (t - A.t) / (B.t - A.t)));
  const r = document.documentElement.style;
  r.setProperty('--sky-top', mix(A.a,B.a,k));
  r.setProperty('--sky-mid', mix(A.b,B.b,k));
  r.setProperty('--sky-bot', mix(A.c,B.c,k));
  const night = A.n + (B.n - A.n) * k;
  r.setProperty('--night', night.toFixed(3));
  starsEl.style.opacity = Math.max(0, (night - .15) / .85).toFixed(3);
  $('#cPhase').textContent = k < .5 ? A.name : B.name;
  return night;
}

/* ---------- 9. 状态与主循环 ---------- */
const S = {
  running:true, speed:1, skyMode:'auto',
  x:0, hop:0, y:0, big:false, jumps:0, carrots:0,
  phase:'run',       // run → arrive → enter → done
  time:0, arriveT:0, camX:0
};

function reset(){
  S.running = true; S.x = 0; S.hop = 0; S.y = 0; S.big = false;
  S.jumps = 0; S.carrots = 0; S.phase = 'run'; S.time = 0; S.arriveT = 0; S.camX = 0;
  parts.forEach(p => p.el.remove()); parts.length = 0;
  if(bunny) bunny.remove();
  fireflies.forEach(f => f.remove());
  buildWorld();
  doorWrap.classList.remove('open');
  winGlows.forEach(g => g.classList.remove('on'));
  $('#end').classList.remove('show');
  $('#cCarrot').textContent = 0;
  $('#cJump').textContent = 0;
  $('#btnPlay').textContent = '⏸ 暂停';
  measure();
}

function measure(){
  SW = scene.clientWidth; SH = scene.clientHeight;
}

function jump(big){
  if(S.phase !== 'run' && S.phase !== 'arrive') return;
  if(S.y > 2) return;                 // 空中不重复触发
  S.big = !!big;
  if(big){
    beep(660, .12, 'square', .06);
    spawn(S.camX ? bunnyScreenX() : 100, 12, ['#fff','#e9e6db'], 8, {vy:60, vx:140, life:.5});
  }
}
function bunnyScreenX(){ return S.x - S.camX; }

let last = performance.now();
function loop(now){
  const raw = Math.min(.05, (now - last) / 1000);
  last = now;
  const dt = raw * S.speed;

  if(S.running){
    S.time += raw;

    /* --- 位移 --- */
    if(S.phase === 'run'){
      S.x += CFG.SPEED * dt;
      if(S.x >= CFG.DOOR_X - 70){ S.phase = 'arrive'; S.arriveT = 0; }
    }else if(S.phase === 'arrive'){
      S.x += CFG.SPEED * .55 * dt;
      S.arriveT += dt;
      if(S.arriveT > .9 && !doorWrap.classList.contains('open')){
        doorWrap.classList.add('open');
        beep(330, .18, 'triangle', .05);
        spawn(bunnyScreenX() + 40, 40, ['#c7a06a','#8f6b3c'], 10, {vy:70, life:.6});
      }
      if(S.x >= CFG.DOOR_X - 6){ S.phase = 'enter'; enterHouse(); }
    }

    /* --- 跳跃 --- */
    if(S.phase === 'run' || S.phase === 'arrive'){
      const prev = S.hop;
      S.hop += dt / CFG.HOP_T;
      if(S.hop >= 1){
        S.hop -= 1; S.jumps++; S.big = false;
        $('#cJump').textContent = S.jumps;
        // 落地扬尘
        spawn(bunnyScreenX() + 20, 6, ['#8a6b42','#6f5030','#9a7c4e'], 6, {vy:70, vx:120, life:.5, size:4});
        beep(220 + Math.random()*40, .06, 'square', .028);
      }
      const H = S.big ? CFG.BIG_H : CFG.HOP_H;
      S.y = Math.sin(Math.PI * S.hop) * H;
      if(prev > S.hop) S.big = S.big; // noop，保持可读
    }

    /* --- 相机 --- */
    const maxCam = CFG.DOOR_X + 420 - SW;
    S.camX = Math.max(0, Math.min(maxCam, S.x - SW * 0.30));

    /* --- 胡萝卜 --- */
    carrots.forEach(c => {
      if(!c.got && S.x + 40 > c.x && Math.abs(S.x - c.x) < 60){
        c.got = true; c.el.classList.add('gone');
        S.carrots++; $('#cCarrot').textContent = S.carrots;
        beep(880, .1, 'triangle', .05);
        spawn(c.x - S.camX, 34, ['#ff9d3a','#f2d24b','#4f8a2c'], 10, {vy:110, life:.6});
      }
    });

    /* --- 苦力怕：靠近自动大跳 --- */
    creepers.forEach(cr => {
      if(!cr.done && S.x > cr.x - 110 && S.x < cr.x){
        cr.done = true;
        cr.el.classList.add('hiss');
        S.hop = 0.02; S.big = true;
        beep(140, .22, 'sawtooth', .045);
        spawn(cr.x - S.camX + 40, 60, ['#8be04a','#4b8f3c'], 12, {vy:90, life:.7});
      }
    });
  }

  render();
  requestAnimationFrame(loop);
}

function enterHouse(){
  bunny.style.setProperty('--bx', (bunnyScreenX()) + 'px');
  bunny.classList.add('gone');
  setTimeout(() => {
    winGlows.forEach(g => g.classList.add('on'));
    doorWrap.classList.remove('open');
    beep(523, .14, 'triangle', .05);
    setTimeout(() => beep(784, .22, 'triangle', .05), 150);
    // 烟囱炊烟 + 爱心
    const hx = CFG.DOOR_X - S.camX;
    for(let i=0;i<5;i++){
      setTimeout(() => spawn(hx - 10, 150, 'rgba(230,230,230,.85)', 3,
        {vy:40, vx:26, g:-16, life:2.2, size:8}), i*260);
    }
    ['❤','❤','✨'].forEach((t,i) =>
      setTimeout(() => spawn(hx + 10, 120, '#fff', 1,
        {text:t, vy:56, vx:40, g:26, life:1.5, fs:20}), i*300));
    setTimeout(finish, 1500);
  }, 700);
}

function finish(){
  S.phase = 'done';
  $('#sCarrot').textContent = S.carrots;
  $('#sJump').textContent = S.jumps;
  $('#sTime').textContent = S.time.toFixed(1) + 's';
  $('#end').classList.add('show');
}

/* ---------- 10. 渲染 ---------- */
function render(){
  const prog = Math.min(1, S.x / CFG.DOOR_X);

  // 天色
  let night;
  if(S.skyMode === 'auto')      night = applySky(prog);
  else if(S.skyMode === 'day')  night = applySky(0.2);
  else                          night = applySky(1);

  // 太阳 / 月亮：沿弧线运动
  const arc = (k, el, hide) => {
    const ang = Math.PI * (0.06 + k * 0.88);
    const cx = SW * 0.5, cy = SH - 40, rx = SW * 0.62, ry = SH * 0.82;
    el.style.transform =
      `translate(${cx - Math.cos(ang)*rx - 26}px,${cy - Math.sin(ang)*ry - 26}px)`;
    el.style.opacity = hide;
  };
  const sunK = Math.min(1, prog / 0.86);
  arc(sunK, sunEl, prog < 0.9 ? 1 : Math.max(0, (0.96 - prog) / 0.06));
  const moonK = Math.max(0, (prog - 0.62) / 0.38);
  arc(moonK, moonEl, Math.min(1, Math.max(0, (prog - 0.66) / 0.14)));

  // 视差
  world.style.transform = `translate3d(${-S.camX}px,0,0)`;
  hills.style.transform = `translate3d(${-S.camX * 0.32}px,0,0)`;
  const gp = -S.camX % 32;
  ground.style.backgroundPosition   = `${gp}px 0, 0 0, ${gp}px 0`;
  grassTop.style.backgroundPosition = `${gp}px 0`;

  // 云漂移
  [...cloudsEl.children].forEach(c => {
    const sp = +c.dataset.sp;
    let x = (+c.dataset.x) - S.camX * 0.0 - sp * 0.35;
    c.dataset.x = x;
    c.style.transform = `translate3d(${(x - S.camX * sp * 0.5) % (SW + 400)}px,0,0)`;
  });

  // 兔子
  if(bunny && S.phase !== 'done'){
    const sx = bunnyScreenX();
    const airborne = S.y > 6;
    bunnyA.style.opacity = airborne ? 0 : 1;
    bunnyB.style.opacity = airborne ? 1 : 0;
    // 起跳拉伸 / 落地压扁
    const k = Math.sin(Math.PI * S.hop);
    const sy = airborne ? 1 + k * 0.10 : 1 - (1 - k) * 0.14;
    const sxs = airborne ? 1 - k * 0.06 : 1 + (1 - k) * 0.10;
    const tilt = airborne ? (S.hop < .5 ? -7 : 7) : 0;
    bunny.style.bottom = `calc(var(--ground-h) + ${S.y}px)`;
    bunny.style.transform =
      `translateX(${sx}px) scale(${sxs.toFixed(3)},${sy.toFixed(3)}) rotate(${tilt}deg)`;
  }

  // 萤火虫
  fireflies.forEach(f => {
    f._p += 0.02 * f._s;
    f.style.opacity = night > .35 ? (0.35 + Math.sin(f._p*2)*0.35) * night : 0;
    f.style.transform = `translate(${Math.cos(f._p)*f._r}px,${Math.sin(f._p*1.4)*f._r*0.7}px)`;
  });

  // HUD
  $('#barFill').style.width = (prog * 100) + '%';
  $('#barIcon').style.left  = (prog * 100) + '%';

  stepParts(1/60);
}

/* ---------- 11. 交互 ---------- */
$('#btnPlay').onclick = e => {
  S.running = !S.running;
  e.target.textContent = S.running ? '⏸ 暂停' : '▶ 播放';
};
$('#btnReset').onclick = reset;
$('#again').onclick = reset;
const SPEEDS = [0.5, 1, 1.5, 2];
let si = 1;
$('#btnSpeed').onclick = e => {
  si = (si + 1) % SPEEDS.length;
  S.speed = SPEEDS[si];
  e.target.textContent = '速度 ' + S.speed + '×';
};
const MODES = [['auto','自动'],['day','白天'],['night','夜晚']];
let mi = 0;
$('#btnSky').onclick = e => {
  mi = (mi + 1) % MODES.length;
  S.skyMode = MODES[mi][0];
  e.target.textContent = '天色 ' + MODES[mi][1];
};
$('#btnSound').onclick = e => {
  soundOn = !soundOn;
  e.target.textContent = soundOn ? '🔊 音效开' : '🔇 音效关';
  e.target.classList.toggle('on', soundOn);
  if(soundOn) beep(523, .1);
};
scene.onclick = () => jump(true);
window.addEventListener('keydown', ev => {
  if(ev.code === 'Space'){ ev.preventDefault(); jump(true); }
  if(ev.code === 'KeyR') reset();
  if(ev.code === 'KeyP') $('#btnPlay').click();
});
window.addEventListener('resize', measure);

/* ---------- 12. 启动 ---------- */
buildStatic();
buildWorld();
measure();
requestAnimationFrame(t => { last = t; loop(t); });
</script>
